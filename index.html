<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS1 P2P Gateway | Secure Transfer</title>
    <style>
        :root {
            --deep-blue: #0a192f;
            --royal-blue: #003366;
            --white: #ffffff;
            --off-white: #f4f7f6;
            --gold: #ffd700;
            --gold-dark: #b8860b;
            --text-dark: #1a1a1a;
            --text-grey: #555555;
            --success: #008000; /* Darker green for white bg */
            --whatsapp: #25D366;
            --error: #d32f2f; /* Darker red for white bg */
            --shadow-soft: 0 10px 30px rgba(10, 25, 47, 0.15);
            --shadow-gold: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        body { 
            background: var(--off-white); 
            color: var(--text-dark); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow-x: hidden;
            position: relative;
        }

        /* --- ROTATING DEEP BLUE GLOW BACKGROUND --- */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vw;
            background: radial-gradient(circle, rgba(10, 25, 47, 0.8) 0%, rgba(0, 51, 102, 0.4) 40%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: rotateGlow 10s linear infinite;
            opacity: 0.6;
        }

        @keyframes rotateGlow {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        .box { 
            background: var(--white); 
            padding: 3rem 2.5rem; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 215, 0, 0.3); 
            width: 90%; 
            max-width: 450px; 
            text-align: center; 
            box-shadow: var(--shadow-soft), 0 0 40px rgba(10, 25, 47, 0.2); 
            position: relative; 
            overflow: hidden; 
            backdrop-filter: blur(10px);
        }

        /* --- 3D TEXT EFFECTS --- */
        h1 { 
            color: var(--deep-blue); 
            margin-top: 0; 
            font-size: 2rem; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 
                1px 1px 0px rgba(255, 215, 0, 0.5),
                2px 2px 0px rgba(255, 215, 0, 0.3),
                3px 3px 5px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        .brand { 
            font-size: 0.75rem; 
            color: var(--royal-blue); 
            margin-bottom: 30px; 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
            font-weight: 700;
            opacity: 0.9;
            border-bottom: 2px solid var(--gold);
            display: inline-block;
            padding-bottom: 5px;
        }
        
        input, select, button { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
            background: #fafafa; 
            color: var(--text-dark); 
            box-sizing: border-box; 
            font-size: 1rem; 
            outline: none; 
            transition: all 0.3s ease; 
            font-weight: 500;
        }

        input:focus, select:focus { 
            border-color: var(--deep-blue); 
            background: #fff;
            box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.1);
            transform: translateY(-2px);
        }
        
        /* --- 3D GOLD BUTTONS --- */
        button { 
            background: linear-gradient(to bottom, var(--gold), var(--gold-dark)); 
            color: #000; 
            font-weight: 800; 
            cursor: pointer; 
            border: none; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
            box-shadow: 
                0 4px 0 #8b6508, 
                0 5px 10px rgba(0,0,0,0.2);
            transition: all 0.1s;
            position: relative;
            top: 0;
        }

        button:hover { 
            filter: brightness(1.05);
        }

        button:active { 
            top: 4px;
            box-shadow: 
                0 0 0 #8b6508, 
                inset 0 2px 5px rgba(0,0,0,0.2);
        }
        
        button.secondary { 
            background: transparent; 
            border: 2px solid var(--deep-blue); 
            color: var(--deep-blue); 
            text-transform: none; 
            font-weight: 700;
            box-shadow: none;
            top: 0;
        }
        button.secondary:hover { 
            background: rgba(10, 25, 47, 0.05); 
            top: 0;
            box-shadow: none;
        }
        button.secondary:active {
            top: 2px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .hidden { display: none; }
        
        .msg { margin-top: 15px; font-size: 0.95rem; min-height: 24px; line-height: 1.5; font-weight: 600; }
        .success { color: var(--success); }
        .error { color: var(--error); }

        /* --- PROFESSIONAL PREVIEW CARD (White Theme) --- */
        .preview-card {
            margin-top: 20px;
            background: #f8f9fa;
            border: 1px solid var(--success);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .preview-header {
            color: var(--success);
            font-size: 0.9rem;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            text-transform: uppercase;
        }
        .preview-body {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #333;
            white-space: pre-wrap; 
            border-left: 4px solid var(--whatsapp);
            margin-bottom: 20px;
            line-height: 1.6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .preview-actions {
            display: flex;
            gap: 12px;
        }
        .btn-wa {
            background: var(--whatsapp);
            color: white;
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            border: none;
            box-shadow: 0 4px 0 #1ebc57, 0 5px 10px rgba(37, 211, 102, 0.3);
            top: 0;
        }
        .btn-wa:active { top: 4px; box-shadow: 0 0 0 #1ebc57; }
        
        .btn-copy {
            background: #fff;
            border: 2px solid var(--text-grey);
            color: var(--text-grey);
            flex: 1;
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 700;
            box-shadow: 0 4px 0 #ddd, 0 5px 5px rgba(0,0,0,0.1);
            top: 0;
        }
        .btn-copy:active { top: 4px; box-shadow: 0 0 0 #ddd; }
        .btn-copy:hover { border-color: var(--text-dark); color: var(--text-dark); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 400px) {
            .preview-actions { flex-direction: column; }
            .btn-wa, .btn-copy { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Rotating Background Glow -->
    <div class="glow-bg"></div>

    <div class="box">
        <h1>KS1 P2P Gateway</h1>
        <div class="brand">Non-custodial • Africa-first • Nonprofit-powered</div>
        
        <!-- LOGIN VIEW -->
        <div id="login-view">
            <input type="text" id="phone" placeholder="Phone Number (e.g. 233...)" value="233555123456">
            <input type="password" id="pass" placeholder="Password" value="demo123">
            <button onclick="login()">🔐 Secure Login</button>
            <div id="login-msg" class="msg"></div>
            <p style="font-size:0.75rem; color:#888; margin-top:20px; line-height: 1.4;">Demo Credentials:<br><strong>User:</strong> 233555123456 / demo123<br><strong>Admin:</strong> 233555987654 / admin123</p>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dash-view" class="hidden">
            <h2 id="welcome-msg" style="color:var(--deep-blue); margin-bottom:5px; font-size: 1.5rem; text-shadow: 1px 1px 0 rgba(255,215,0,0.4);">Welcome</h2>
            
            <div style="text-align:left; background:#f8f9fa; padding:20px; border-radius:12px; margin-bottom:25px; border-left: 5px solid var(--gold); box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                <div style="font-size:0.85rem; color:#666; text-transform:uppercase; letter-spacing:1px; font-weight:700;">Available Balance</div>
                <div style="font-size:1.4rem; color:var(--deep-blue); font-weight:800; margin-top:5px;">
                    💰 <span id="bal-usdc" style="color:var(--gold-dark);">0.00</span> USDC <br>
                    <span style="font-size:1.2rem; color:#555;">💎 <span id="bal-eth">0.00</span> ETH</span>
                </div>
            </div>
            
            <label style="display:block; text-align:left; font-size:0.85rem; color:#666; margin-bottom:8px; font-weight:700;">Receiver's WhatsApp Number</label>
            <input type="text" id="recv-phone" placeholder="+233..." value="">
            <button onclick="findUser()" style="background: linear-gradient(to bottom, #4facfe, #00f2fe); color: #003366; font-weight:800; box-shadow: 0 4px 0 #008080, 0 5px 10px rgba(0,0,0,0.2);">🔍 Find User</button>
            <div id="find-msg" class="msg"></div>
            <input type="hidden" id="recv-id">

            <div style="display:flex; gap:12px; margin-top:20px;">
                <input type="number" id="amt" placeholder="Amount" style="flex:2;" step="0.01">
                <select id="asset" style="flex:1; font-weight:600;"><option value="usdc">USDC</option><option value="eth">ETH</option></select>
            </div>
            
            <button onclick="send()" style="margin-top:15px; font-size:1.05rem;">🚀 Send Funds (1% Fee)</button>
            
            <!-- Dynamic Message Area -->
            <div id="send-msg" class="msg"></div>
            
            <button onclick="logout()" class="secondary" style="margin-top:30px; width:auto; padding:12px 25px; border-radius:50px;">Logout</button>
        </div>
    </div>

    <script>
        const API = "https://ks1-backend-v3.onrender.com";
        let token = localStorage.getItem('k_token');
        let role = localStorage.getItem('k_role');

        if(token) showDash();

        async function login() {
            const p = document.getElementById('phone').value.trim();
            const pw = document.getElementById('pass').value;
            const msg = document.getElementById('login-msg');
            msg.textContent = "Authenticating securely...";
            msg.className = "msg";
            try {
                const r = await fetch(`${API}/api/v1/auth/login`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ identifier: p, password: pw })
                });
                const d = await r.json();
                if(d.success) {
                    token = d.data.token; role = d.data.user.role;
                    localStorage.setItem('k_token', token); localStorage.setItem('k_role', role);
                    msg.textContent = "✅ Success! Redirecting..."; msg.className = "msg success";
                    setTimeout(showDash, 1000);
                } else { msg.textContent = "❌ " + d.message; msg.className = "msg error"; }
            } catch(e) { msg.textContent = "❌ Connection Failed"; msg.className = "msg error"; }
        }

        function showDash() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dash-view').classList.remove('hidden');
            document.getElementById('welcome-msg').textContent = role === 'admin' ? '👑 Admin Dashboard' : '👤 User Dashboard';
            if(role === 'user') {
                document.getElementById('bal-usdc').textContent = "1,000.00";
                document.getElementById('bal-eth').textContent = "5.00";
            } else { 
                document.getElementById('bal-usdc').textContent = "0.00";
                document.getElementById('bal-eth').textContent = "0.00";
                loadTreasury(); 
            }
        }

        async function findUser() {
            const p = document.getElementById('recv-phone').value;
            const msg = document.getElementById('find-msg');
            if(!p) return;
            msg.textContent = "🔍 Searching network...";
            msg.className = "msg";
            try {
                const r = await fetch(`${API}/api/v1/users/search?phone=${encodeURIComponent(p)}`, { headers: {'Authorization': `Bearer ${token}`} });
                const d = await r.json();
                if(d.success) {
                    document.getElementById('recv-id').value = d.data.userId;
                    msg.innerHTML = `✅ <strong>Verified:</strong> ${d.data.phone}`;
                    msg.className = "msg success";
                } else { msg.textContent = "❌ " + d.message; msg.className = "msg error"; }
            } catch(e) { msg.textContent = "❌ Network Error"; msg.className = "msg error"; }
        }

        async function send() {
            const id = document.getElementById('recv-id').value;
            const amt = parseFloat(document.getElementById('amt').value);
            const asset = document.getElementById('asset').value;
            const receiverPhoneRaw = document.getElementById('recv-phone').value;
            const senderPhoneRaw = document.getElementById('phone').value.trim();
            const msgDiv = document.getElementById('send-msg');
            
            if(!id || !amt) { msgDiv.textContent = "⚠️ Please find a user and enter an amount."; msgDiv.className = "msg error"; return; }

            msgDiv.innerHTML = "⏳ Processing transaction...";
            msgDiv.className = "msg";

            try {
                const r = await fetch(`${API}/api/v1/p2p/transfer`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json', 'Authorization': `Bearer ${token}`},
                    body: JSON.stringify({ receiverId: id, asset, amount: amt })
                });
                const d = await r.json();

                if(d.success) {
                    const fee = d.data.treasury_fee;
                    const cleanPhone = receiverPhoneRaw.replace(/[\+\-\s]/g, '');
                    const txRef = "KS1-" + Math.floor(100000 + Math.random() * 900000);
                    
                    const messageText = `🔔 *KS1 P2P Gateway Notification*\n\n` +
                        `Dear User,\n\n` +
                        `You have successfully received a payment.\n\n` +
                        `💰 *Amount:* ${amt} ${asset.toUpperCase()}\n` +
                        `👤 *From:* ${senderPhoneRaw}\n` +
                        `🆔 *Ref ID:* ${txRef}\n` +
                        `📉 *Network Fee:* ${fee} ${asset.toUpperCase()}\n\n` +
                        `Status: ✅ *Confirmed*\n\n` +
                        `Powered by KS1 Empower Pay`;

                    const encodedMsg = encodeURIComponent(messageText);
                    const waLink = `https://wa.me/${cleanPhone}?text=${encodedMsg}`;

                    msgDiv.className = "msg success";
                    msgDiv.innerHTML = `
                        <div style="margin-bottom:15px; font-weight:700; color:var(--success);">✅ <strong>Transaction Successful!</strong><br>Funds sent. Fee: ${fee} ${asset.toUpperCase()}</div>
                        
                        <div class="preview-card">
                            <div class="preview-header">
                                <span>📱</span> Ready to Send Receipt
                            </div>
                            <div class="preview-body">${messageText.replace(/\n/g, '<br>')}</div>
                            <div class="preview-actions">
                                <button class="btn-copy" onclick="copyToClipboard(\`${messageText.replace(/`/g, '\\`')}\`)">📋 Copy Text</button>
                                <a href="${waLink}" target="_blank" class="btn-wa" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">
                                    <span>💬</span> Send via WhatsApp
                                </a>
                            </div>
                        </div>
                    `;
                    
                    document.getElementById('amt').value = '';

                } else {
                    msgDiv.textContent = "❌ Failed: " + d.message;
                    msgDiv.className = "msg error";
                }
            } catch(e) { 
                msgDiv.textContent = "❌ Network Error. Please try again."; 
                msgDiv.className = "msg error"; 
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Message copied to clipboard!");
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert("Could not copy automatically. Please select text manually.");
            });
        }

        async function loadTreasury() {
            try {
                const r = await fetch(`${API}/api/v1/admin/treasury`, { headers: {'Authorization': `Bearer ${token}`} });
                const d = await r.json();
                if(d.success) {
                    let info = d.data.length ? d.data.map(i => `${i._id}: ${i.total}`).join(', ') : "No transactions yet.";
                    alert("🏦 Treasury Report:\n" + info);
                }
            } catch(e) {}
        }

        function logout() {
            localStorage.clear(); location.reload();
        }
    </script>
</body>
</html>
