<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS1 P2P Gateway | Secure Transfer</title>
    <style>
        :root {
            --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #1a1a1a; --text-sub: #555555;
            --glow-color: rgba(10, 25, 47, 0.6); --border-color: rgba(255, 215, 0, 0.3);
            --input-bg: #fafafa; --input-border: #ddd; --deep-blue: #0a192f; --royal-blue: #003366;
            --gold: #ffd700; --gold-dark: #b8860b; --gold-shadow: #8b6508;
            --shadow-soft: 0 10px 30px rgba(10, 25, 47, 0.15);
        }
        body.dark-mode {
            --bg-color: #050f1e; --card-bg: #112240; --text-main: #e6f1ff; --text-sub: #8892b0;
            --glow-color: rgba(255, 255, 255, 0.1); /* White glow base */
            --border-color: rgba(255, 215, 0, 0.5);
            --input-bg: #0a192f; --input-border: #ffd700; --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            position: relative; 
            transition: background 0.4s ease;
            font-weight: 600;
            font-size: 16px;
        }

        /* --- DEEP BLUE GLOW (LIGHT MODE) --- */
        .glow-bg-light {
            position: fixed;
            top: 50%; left: 50%;
            width: 150vw; height: 150vw;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 60%);
            transform: translate(-50%, -50%);
            z-index: -2;
            animation: rotateGlow 12s linear infinite;
            opacity: 0.8;
        }

        /* --- BOLD WHITE GLOW (DARK MODE ONLY) --- */
        .glow-bg-dark {
            position: fixed;
            top: 50%; left: 50%;
            width: 200vw; height: 200vw;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 70% 70%, rgba(255, 255, 255, 0.12) 0%, transparent 50%);
            transform: translate(-50%, -50%);
            z-index: -2;
            animation: rotateGlowBold 15s linear infinite;
            opacity: 1;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes rotateGlowBold {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.05); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        /* --- LANDING CARD --- */
        .landing-card {
            background: linear-gradient(135deg, var(--card-bg), #eef2f7);
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            box-shadow: 
                0 0 0 1px rgba(255, 215, 0, 0.2),
                0 20px 50px rgba(10, 25, 47, 0.2);
            position: relative;
            overflow: hidden;
            max-width: 520px;
            width: 90%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            z-index: 10;
        }
        body.dark-mode .landing-card {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            box-shadow: 
                0 0 0 1px rgba(255, 215, 0, 0.3),
                0 20px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .landing-title {
            font-size: 2.2rem;
            font-weight: 900;
            margin: 0 0 15px;
            background: linear-gradient(to right, var(--deep-blue), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.1);
        }
        body.dark-mode .landing-title {
            background: linear-gradient(to right, var(--gold), #64ffda);
            -webkit-text-fill-color: transparent;
        }
        .landing-brand {
            font-size: 0.85rem;
            color: var(--royal-blue);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 25px;
            opacity: 0.9;
        }
        body.dark-mode .landing-brand { color: var(--gold); }

        .landing-icon {
            font-size: 3.5rem;
            margin: 20px 0;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .landing-desc {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: var(--text-sub);
            font-weight: 500;
        }
        body.dark-mode .landing-desc { color: #cbd5e1; }

        input, select { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid var(--input-border); 
            background: var(--input-bg); 
            color: var(--text-main); 
            box-sizing: border-box; 
            font-size: 1rem; 
            outline: none; 
            font-weight: 600;
        }
        input:focus { 
            border-color: var(--gold); 
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
        }
        
        button { 
            width: 100%;
            background: linear-gradient(to bottom, var(--gold), var(--gold-dark)); 
            color: #000; 
            font-weight: 800; 
            border: none; 
            border-radius: 8px;
            padding: 14px;
            margin: 10px 0;
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            box-shadow: 0 4px 0 var(--gold-shadow), 0 5px 12px rgba(0,0,0,0.2);
            transition: all 0.1s;
            position: relative;
            top: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-size: 1rem;
        }
        button:hover { 
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 5px 0 var(--gold-shadow), 0 7px 15px rgba(0,0,0,0.25);
        }
        button:active { 
            top: 4px;
            box-shadow: 0 0 0 var(--gold-shadow), inset 0 2px 5px rgba(0,0,0,0.2);
            transform: none;
        }

        .btn-small { 
            width: auto; 
            padding: 8px 15px; 
            font-size: 0.85rem; 
            margin: 5px;
            border-radius: 6px;
        }

        .btn-group { 
            display: flex; 
            gap: 10px; 
            margin-top: 15px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }
        .btn-group button { 
            margin: 5px; 
            flex: 1; 
            min-width: 120px; 
            padding: 12px;
        }
        
        .hidden { display: none; }
        
        .msg { 
            margin-top: 15px; 
            font-size: 0.95rem; 
            font-weight: 700;
            color: var(--deep-blue); 
        }
        body.dark-mode .msg { color: var(--gold); }
        .success { color: var(--deep-blue); } 
        body.dark-mode .success { color: var(--gold); }
        .error { color: #d32f2f; }
        .link-text { 
            color: var(--royal-blue); 
            text-decoration: underline; 
            cursor: pointer; 
            margin-top: 10px; 
            display: block; 
            font-weight: 700;
        }
        body.dark-mode .link-text { color: var(--gold); }

        .balance-card { 
            text-align: left; 
            background: var(--input-bg); 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border-left: 4px solid var(--gold); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--input-border);
        }
        body.dark-mode .balance-card { 
            background: rgba(10, 25, 47, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .balance-label { 
            font-size: 0.9rem; 
            color: var(--text-sub); 
            text-transform: uppercase; 
            font-weight: 800; 
            display: block; 
            margin-bottom: 12px; 
            letter-spacing: 1px;
        }
        .balance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 1.1rem;
            font-weight: 800;
        }
        .balance-asset {
            color: var(--deep-blue);
        }
        body.dark-mode .balance-asset { color: #cbd5e1; }

        .ledger-container,
        .user-list,
        .preview-card,
        .treasury-stats,
        .stat-card {
            /* Existing styles unchanged */
        }

        .dashboard-title {
            color: var(--gold);
            font-size: 1.6rem;
            font-weight: 800;
            text-shadow: 
                1px 1px 0 rgba(0,0,0,0.2),
                2px 2px 0 rgba(0,0,0,0.1),
                0 0 15px rgba(255, 215, 0, 0.4);
            margin: 0;
            letter-spacing: 0.5px;
            text-align: left;
        }
        body.dark-mode .dashboard-title {
            text-shadow: 
                1px 1px 0 rgba(0,0,0,0.3),
                0 0 20px rgba(255, 215, 0, 0.6);
        }
    </style>
</head>
<body>
    <!-- ✅ DUAL GLOW SYSTEM -->
    <div class="glow-bg-light"></div>
    <div class="glow-bg-dark" style="display: none;"></div>

    <script>
        // Show/hide glow based on theme
        function updateGlow() {
            const isDark = document.body.classList.contains('dark-mode');
            document.querySelector('.glow-bg-light').style.display = isDark ? 'none' : 'block';
            document.querySelector('.glow-bg-dark').style.display = isDark ? 'block' : 'none';
        }

        // Initialize on load
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        updateGlow();
    </script>
