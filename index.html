<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS1 P2P Gateway | Secure Transfer</title>
    <style>
        :root {
            --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #1a1a1a; --text-sub: #555555;
            --glow-color: rgba(10, 25, 47, 0.6); --border-color: rgba(255, 215, 0, 0.3);
            --input-bg: #fafafa; --input-border: #ddd; --deep-blue: #0a192f; --royal-blue: #003366;
            --gold: #ffd700; --gold-dark: #b8860b; --gold-shadow: #8b6508;
            --shadow-soft: 0 10px 30px rgba(10, 25, 47, 0.15);
        }
        body.dark-mode {
            --bg-color: #050f1e; --card-bg: #112240; --text-main: #e6f1ff; --text-sub: #8892b0;
            --glow-color: rgba(255, 215, 0, 0.15); --border-color: rgba(255, 215, 0, 0.5);
            --input-bg: #0a192f; --input-border: #ffd700; --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        body { background: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; position: relative; transition: background 0.4s ease; }
        .glow-bg { position: fixed; top: 50%; left: 50%; width: 150vw; height: 150vw; background: radial-gradient(circle, var(--glow-color) 0%, transparent 60%); transform: translate(-50%, -50%); z-index: -1; animation: rotateGlow 12s linear infinite; opacity: 0.8; }
        @keyframes rotateGlow { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        .box { background: var(--card-bg); padding: 2.5rem; border-radius: 20px; border: 1px solid var(--border-color); width: 90%; max-width: 500px; text-align: center; box-shadow: var(--shadow-soft); position: relative; overflow: hidden; backdrop-filter: blur(10px); }
        h1 { color: var(--deep-blue); font-size: 2rem; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; text-shadow: 1px 1px 0 rgba(255,215,0,0.5); }
        body.dark-mode h1 { color: var(--gold); text-shadow: 0 0 15px rgba(255,215,0,0.4); }
        .brand { font-size: 0.75rem; color: var(--royal-blue); margin-bottom: 30px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; border-bottom: 2px solid var(--gold); display: inline-block; padding-bottom: 5px; }
        body.dark-mode .brand { color: var(--gold); }
        input, select { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); box-sizing: border-box; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,0,0.2); }
        button { width: 100%; background: linear-gradient(to bottom, var(--gold), var(--gold-dark)); color: #000; font-weight: 800; border: none; border-radius: 8px; padding: 14px; margin: 10px 0; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 var(--gold-shadow), 0 5px 10px rgba(0,0,0,0.2); transition: 0.1s; position: relative; top: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        button:hover { filter: brightness(1.05); transform: translateY(-2px); }
        button:active { top: 4px; box-shadow: 0 0 0 var(--gold-shadow); }
        .btn-small { width: auto; padding: 8px 15px; font-size: 0.85rem; margin: 5px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
        .btn-group button { margin: 5px; flex: 1; min-width: 120px; }
        .hidden { display: none; }
        .msg { margin-top: 15px; font-size: 0.95rem; font-weight: 600; color: var(--deep-blue); }
        body.dark-mode .msg { color: var(--gold); }
        .success { color: var(--deep-blue); } body.dark-mode .success { color: var(--gold); }
        .error { color: #d32f2f; }
        .link-text { color: var(--royal-blue); text-decoration: underline; cursor: pointer; margin-top: 10px; display: block; }
        body.dark-mode .link-text { color: var(--gold); }
        .balance-card { text-align: left; background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)); padding: 25px; border-radius: 15px; margin-bottom: 25px; border-left: 6px solid var(--gold); box-shadow: inset 0 0 20px rgba(0,0,0,0.05); border: 1px solid rgba(255,215,0,0.1); }
        body.dark-mode .balance-card { background: linear-gradient(135deg, rgba(10,25,47,0.8), rgba(17,34,64,0.8)); border: 1px solid rgba(255,215,0,0.2); }
        .balance-label { font-size: 0.85rem; color: var(--text-sub); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 10px; }
        .balance-amount { font-size: 1.6rem; color: var(--deep-blue); font-weight: 900; }
        body.dark-mode .balance-amount { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .balance-sub { font-size: 1.3rem; color: var(--text-sub); font-weight: 600; display: block; margin-top: 5px; }
        body.dark-mode .balance-sub { color: #8892b0; }
        .user-list { text-align: left; max-height: 300px; overflow-y: auto; border: 1px solid var(--input-border); border-radius: 8px; margin-top: 15px; background: var(--input-bg); }
        .user-item { padding: 12px; border-bottom: 1px solid var(--input-border); display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .user-info strong { display: block; color: var(--text-main); }
        .user-info span { font-size: 0.8rem; color: var(--text-sub); }
        .preview-card { margin-top: 20px; background: var(--input-bg); border: 2px solid var(--deep-blue); border-radius: 12px; padding: 20px; text-align: left; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        body.dark-mode .preview-card { border-color: var(--gold); background: rgba(10,25,47,0.5); }
        .preview-header { color: var(--deep-blue); font-size: 0.9rem; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--input-border); padding-bottom: 10px; text-transform: uppercase; }
        body.dark-mode .preview-header { color: var(--gold); border-bottom-color: rgba(255,215,0,0.3); }
        .preview-body { background: var(--card-bg); padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: var(--text-main); white-space: pre-wrap; border-left: 4px solid var(--deep-blue); margin-bottom: 20px; border: 1px solid var(--input-border); }
        body.dark-mode .preview-body { background: rgba(0,0,0,0.2); border-left-color: var(--gold); }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="box">
        <h1>KS1 P2P Gateway</h1>
        <div class="brand">Non-custodial • Africa-first • Nonprofit-powered</div>
        
        <div id="login-view">
            <div id="login-form">
                <input type="text" id="phone" placeholder="Phone Number" value="233555123456">
                <input type="password" id="pass" placeholder="Password" value="demo123">
                <button onclick="login()">🔐 Secure Login</button>
                <span class="link-text" onclick="showResetForm()">Forgot Password?</span>
                <div id="login-msg" class="msg"></div>
                <p style="font-size:0.75rem; color:var(--text-sub); margin-top:20px;">Demo: 233555123456 / demo123</p>
            </div>
            <div id="reset-form" class="hidden">
                <h3 style="color:var(--deep-blue);">Reset Password</h3>
                <input type="text" id="reset-phone" placeholder="Your Phone Number" value="233555123456">
                <input type="text" id="reset-code" placeholder="Code (e.g. KS1-1234)" style="text-transform:uppercase;">
                <input type="password" id="new-password" placeholder="New Password">
                <button onclick="resetPassword()">✅ Set New Password</button>
                <button onclick="showLoginForm()" style="background:transparent; color:var(--text-sub); border:2px solid var(--text-sub); box-shadow:none;">Cancel</button>
                <div id="reset-msg" class="msg"></div>
            </div>
        </div>

        <div id="dash-view" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h2 id="welcome-msg" style="color:var(--deep-blue); margin:0; font-size:1.5rem;">Welcome</h2>
                <button id="theme-toggle" onclick="toggleTheme()" style="width:auto; padding:8px 12px; margin:0; font-size:0.8rem;">🌓 Theme</button>
            </div>
            
            <div class="btn-group" id="nav-tabs" style="margin-bottom:20px;">
                <button onclick="showTab('transfer')" id="tab-transfer">💸 Transfer</button>
                <button onclick="showTab('users')" id="tab-users" class="hidden">👥 Manage Users</button>
            </div>

            <div id="tab-transfer-content">
                <div class="balance-card">
                    <span class="balance-label">Available Balance</span>
                    <div class="balance-amount">💰 <span id="bal-usdc" style="color:var(--gold-dark);">1,000.00</span> USDC</div>
                    <span class="balance-sub">💎 <span id="bal-eth">5.00</span> ETH</span>
                </div>
                <label style="display:block; text-align:left; font-size:0.85rem; color:var(--text-sub); margin-bottom:8px; font-weight:700;">Receiver's WhatsApp Number</label>
                <input type="text" id="recv-phone" placeholder="+233..." value="">
                <div class="btn-group"><button onclick="findUser()">🔍 Find User</button></div>
                <div id="find-msg" class="msg"></div>
                <input type="hidden" id="recv-id">
                <div style="display:flex; gap:12px; margin-top:20px;">
                    <input type="number" id="amt" placeholder="Amount" style="flex:2;" step="0.01">
                    <select id="asset" style="flex:1;"><option value="usdc">USDC</option><option value="eth">ETH</option></select>
                </div>
                <button onclick="send()" style="margin-top:15px;">🚀 Send Funds</button>
                <div id="send-msg" class="msg"></div>
            </div>

            <div id="tab-users-content" class="hidden">
                <h3 style="color:var(--deep-blue); text-align:left;">Registered Users</h3>
                <button onclick="loadUsers()" style="font-size:0.9rem;">🔄 Refresh List</button>
                <div id="user-list-container" class="user-list"><div style="padding:20px;">Loading...</div></div>
                <div id="admin-msg" class="msg"></div>
            </div>
            
            <button onclick="logout()" style="margin-top:30px; background:transparent; color:var(--text-sub); border:2px solid var(--text-sub); box-shadow:none;">Logout</button>
        </div>
    </div>

    <script>
        // ✅ UPDATED TO YOUR LIVE BACKEND URL
        const API = "https://ks1-backend-v3.onrender.com";
        let token = localStorage.getItem('k_token');
        let role = localStorage.getItem('k_role');

        if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        if(token) showDash();

        function toggleTheme() { document.body.classList.toggle('dark-mode'); localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); }
        function showResetForm() { document.getElementById('login-form').classList.add('hidden'); document.getElementById('reset-form').classList.remove('hidden'); }
        function showLoginForm() { document.getElementById('reset-form').classList.add('hidden'); document.getElementById('login-form').classList.remove('hidden'); document.getElementById('reset-msg').textContent = ''; }

        async function login() {
            const p = document.getElementById('phone').value.trim();
            const pw = document.getElementById('pass').value;
            const msg = document.getElementById('login-msg');
            msg.textContent = "Authenticating...";
            try {
                const r = await fetch(`${API}/api/v1/auth/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ identifier: p, password: pw }) });
                const d = await r.json();
                if(d.success) {
                    token = d.result.token; role = d.result.user.role;
                    localStorage.setItem('k_token', token); localStorage.setItem('k_role', role);
                    msg.textContent = "✅ Success!"; msg.className = "msg success";
                    setTimeout(showDash, 1000);
                } else { msg.textContent = "❌ " + d.message; msg.className = "msg error"; }
            } catch(e) { msg.textContent = "❌ Connection Failed"; msg.className = "msg error"; }
        }

        async function resetPassword() {
            const phone = document.getElementById('reset-phone').value.trim();
            const code = document.getElementById('reset-code').value.trim();
            const newPass = document.getElementById('new-password').value;
            const msg = document.getElementById('reset-msg');
            if(!phone || !code || !newPass) { msg.textContent = "⚠️ Fill all fields"; msg.className = "msg error"; return; }
            msg.textContent = "Processing...";
            try {
                const r = await fetch(`${API}/api/v1/auth/reset-password`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ identifier: phone, code, newPassword: newPass }) });
                const d = await r.json();
                if(d.success) { msg.textContent = "✅ " + d.message; msg.className = "msg success"; setTimeout(showLoginForm, 2000); }
                else { msg.textContent = "❌ " + d.message; msg.className = "msg error"; }
            } catch(e) { msg.textContent = "❌ Network Error"; msg.className = "msg error"; }
        }

        function showDash() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dash-view').classList.remove('hidden');
            document.getElementById('welcome-msg').textContent = role === 'admin' ? '👑 Admin Dashboard' : '👤 User Dashboard';
            document.getElementById('theme-toggle').style.display = role === 'admin' ? 'none' : 'block';
            if(role === 'admin') { document.getElementById('tab-users').classList.remove('hidden'); showTab('users'); }
            else { document.getElementById('tab-users').classList.add('hidden'); showTab('transfer'); document.getElementById('bal-usdc').textContent = "1,000.00"; document.getElementById('bal-eth').textContent = "5.00"; }
        }

        function showTab(tabName) {
            document.getElementById('tab-transfer-content').classList.add('hidden');
            document.getElementById('tab-users-content').classList.add('hidden');
            if(tabName === 'transfer') document.getElementById('tab-transfer-content').classList.remove('hidden');
            else if (tabName === 'users') { document.getElementById('tab-users-content').classList.remove('hidden'); loadUsers(); }
        }

        async function loadUsers() {
            const container = document.getElementById('user-list-container');
            const msg = document.getElementById('admin-msg');
            container.innerHTML = '<div style="padding:20px;">Loading...</div>';
            try {
                const r = await fetch(`${API}/api/v1/admin/users`, { headers: {'Authorization': `Bearer ${token}`} });
                const d = await r.json();
                if(d.success && d.result.users.length > 0) {
                    let html = '';
                    d.result.users.forEach(u => {
                        html += `<div class="user-item"><div class="user-info"><strong>${u.phone_number}</strong><span>${u.role.toUpperCase()}</span></div><button class="btn-small" onclick="generateCode('${u._id}', '${u.phone_number}')">🔑 Reset Code</button></div>`;
                    });
                    container.innerHTML = html;
                } else { container.innerHTML = '<div style="padding:20px;">No users found.</div>'; }
            } catch(e) { container.innerHTML = '<div style="padding:20px; color:red;">Error loading.</div>'; }
        }

        async function generateCode(userId, phone) {
            const msg = document.getElementById('admin-msg');
            msg.textContent = "Generating...";
            try {
                const r = await fetch(`${API}/api/v1/admin/generate-reset-code`, { method: 'POST', headers: {'Content-Type':'application/json', 'Authorization': `Bearer ${token}`}, body: JSON.stringify({ userId }) });
                const d = await r.json();
                if(d.success) {
                    msg.innerHTML = `✅ Code for ${phone}: <strong style="font-size:1.2rem; color:var(--gold); background:var(--deep-blue); padding:5px 10px; border-radius:5px;">${d.result.resetCode}</strong>`;
                    msg.className = "msg success";
                } else { msg.textContent = "❌ " + d.message; msg.className = "msg error"; }
            } catch(e) { msg.textContent = "❌ Network Error"; msg.className = "msg error"; }
        }

        async function findUser() {
            const p = document.getElementById('recv-phone').value;
            const msg = document.getElementById('find-msg');
            if(!p) return;
            msg.textContent = "🔍 Searching...";
            try {
                const r = await fetch(`${API}/api/v1/users/search?phone=${encodeURIComponent(p)}`, { headers: {'Authorization': `Bearer ${token}`} });
                const d = await r.json();
                if(d.success) {
                    document.getElementById('recv-id').value = d.result.userId;
                    msg.innerHTML = `✅ <strong>Verified:</strong> ${d.result.phone}`; msg.className = "msg success";
                } else { msg.textContent = "❌ " + d.message; msg.className = "msg error"; }
            } catch(e) { msg.textContent = "❌ Network Error"; msg.className = "msg error"; }
        }

        async function send() {
            const id = document.getElementById('recv-id').value;
            const amt = parseFloat(document.getElementById('amt').value);
            const asset = document.getElementById('asset').value;
            const receiverPhoneRaw = document.getElementById('recv-phone').value;
            const senderPhoneRaw = document.getElementById('phone').value.trim();
            const msgDiv = document.getElementById('send-msg');
            if(!id || !amt) { msgDiv.textContent = "⚠️ Find user & enter amount."; msgDiv.className = "msg error"; return; }
            msgDiv.innerHTML = "⏳ Processing..."; msgDiv.className = "msg";
            try {
                const r = await fetch(`${API}/api/v1/p2p/transfer`, { method: 'POST', headers: {'Content-Type':'application/json', 'Authorization': `Bearer ${token}`}, body: JSON.stringify({ receiverId: id, asset, amount: amt }) });
                const d = await r.json();
                if(d.success) {
                    const fee = d.result.treasury_fee;
                    const cleanPhone = receiverPhoneRaw.replace(/[\+\-\s]/g, '');
                    const txRef = "KS1-" + Math.floor(100000 + Math.random() * 900000);
                    const messageText = `🔔 *KS1 P2P Gateway*\n\nReceived: ${amt} ${asset.toUpperCase()}\nFrom: ${senderPhoneRaw}\nRef: ${txRef}\nFee: ${fee}\nStatus: ✅ Confirmed\n\nPowered by KS1 Empower Pay`;
                    const waLink = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(messageText)}`;
                    msgDiv.className = "msg success";
                    msgDiv.innerHTML = `<div style="margin-bottom:15px; font-weight:700;">✅ <strong>Success!</strong><br>Fee: ${fee}</div><div class="preview-card"><div class="preview-header">📱 Receipt</div><div class="preview-body">${messageText.replace(/\n/g, '<br>')}</div><div class="btn-group"><button onclick="copyToClipboard(\`${messageText.replace(/`/g, '\\`')}\`)" style="margin:0;">📋 Copy</button><a href="${waLink}" target="_blank" style="margin:0; text-decoration:none;">💬 WhatsApp</a></div></div>`;
                    document.getElementById('amt').value = '';
                } else { msgDiv.textContent = "❌ " + d.message; msgDiv.className = "msg error"; }
            } catch(e) { msgDiv.textContent = "❌ Network Error"; msgDiv.className = "msg error"; }
        }

        function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => alert("✅ Copied!")).catch(() => alert("Copy failed.")); }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
